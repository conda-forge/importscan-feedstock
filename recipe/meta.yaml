{% set name = "importscan" %}
{% set version = "1.0.0" %}
{% set sha256 = "eb346742fd225bce326f2d1c0dc97d7ed0a9904175c8958b32f7ef48dd774252" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - importscan

about:
  home: http://importscan.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'Recursively import modules and sub-packages'
  description: |
    importscan provides a scan function that lets you recursively import a package and its sub-modules and sub-packages.
  doc_url: http://importscan.readthedocs.org/
  dev_url: https://github.com/faassen/importscan

extra:
  recipe-maintainers:
    - stuertz
